name: Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  packages: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync fork with upstream
        run: |
          git remote add upstream https://github.com/thedotmack/claude-mem.git
          git fetch upstream --tags --force

          # Fast-forward default branch
          git checkout main
          git merge upstream/main --ff-only || echo "Cannot fast-forward main, skipping branch sync"
          git push origin main --tags || echo "Push failed, may need manual resolution"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for unbuilt tags
        id: new_tags
        run: |
          git fetch upstream --tags --force

          # Tags can't be pushed to the fork (GITHUB_TOKEN lacks `workflows`),
          # so "missing from origin" is meaningless. A tag needs a build iff
          # its image is not already in GHCR. Build only the newest such tag
          # to avoid racing on :latest.
          LATEST=""
          for tag in $(git tag -l 'v*' --sort=-v:refname | head -5); do
            if ! docker buildx imagetools inspect "ghcr.io/trehansalil/claude-mem:${tag#v}" >/dev/null 2>&1; then
              LATEST="$tag"
              break
            fi
          done

          if [ -n "$LATEST" ]; then
            echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
            echo "Unbuilt tag: $LATEST"
          else
            echo "All recent tags already built"
          fi

      - name: Trigger Docker build for newest unbuilt tag
        if: steps.new_tags.outputs.latest != ''
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.new_tags.outputs.latest }}';
            console.log(`Triggering Docker build for ${tag}`);
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker-build.yml',
              ref: 'main',
              inputs: { version: tag }
            });
