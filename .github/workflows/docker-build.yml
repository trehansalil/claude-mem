name: Build & Push Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. v13.12.4)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build
        run: |
          npm install --legacy-peer-deps
          npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version number
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          # Strip leading 'v' if present
          VERSION_NUM="${VERSION#v}"
          echo "tag=$VERSION_NUM" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION_NUM"

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/claude-mem/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/trehansalil/claude-mem:${{ steps.version.outputs.tag }}
            ghcr.io/trehansalil/claude-mem:latest
